# Proxy cache decision-variable library
#
# Load this file in the http context.  `map` variables are evaluated lazily, so
# declaring the optional helpers below has no per-request cost until they are used.
#
# Recommended call site:
#
#     proxy_cache_bypass $proxy_cache_bypass_flag;
#     proxy_no_cache     $proxy_no_cache_flag;
#
# Compatibility: the existing nginx.conf uses $proxy_skip_cache for both
# directives.  That variable remains available at the end of this file and keeps
# the deliberately conservative request-side behaviour.  New configurations
# should use the two purpose-specific variables above so a client revalidation
# request can refresh the shared cache without being forbidden from storing the
# new response.
#
# Official semantics and compatibility references:
#   https://nginx.org/en/docs/http/ngx_http_proxy_module.html#proxy_cache_bypass
#   https://nginx.org/en/docs/http/ngx_http_proxy_module.html#proxy_no_cache
#   https://docs.nginx.com/nginx/admin-guide/content-cache/content-caching/
#   https://freenginx.org/en/docs/http/ngx_http_proxy_module.html
#   https://en.angie.software/angie/docs/configuration/modules/http/http_proxy/
#   https://openresty.org/en/components.html
#   https://github.com/alibaba/tengine
#   https://blog.nginx.org/blog/nginx-caching-guide
#   https://developer.wordpress.org/advanced-administration/server/web-server/nginx/
#   https://developer.woocommerce.com/docs/best-practices/performance/configuring-caching-plugins
#
# In every final map, 0 means "allow" and 1 means "bypass/do not store".


###############################################################################
# 1. Request method, request body and protocol switching
###############################################################################

# NGINX caches GET and HEAD by default.  Keep unsafe/non-idempotent methods away
# from both cache reads and writes even if proxy_cache_methods is later widened.
map $request_method $proxy_skip_method {
    default 1;
    GET     0;
    HEAD    0;
}

# A GET/HEAD request with a body is unusual and can have application-specific
# semantics.  The default proxy cache key does not include the request body.
map "$content_length:$http_transfer_encoding" $proxy_skip_request_body {
    default  1;
    ~^0*:$   0;
}

# WebSocket and other protocol-upgrade handshakes must not receive an ordinary
# cached HTTP response.
map $http_upgrade $proxy_skip_upgrade {
    default 1;
    ""      0;
}


###############################################################################
# 2. Authentication and request cookies
###############################################################################

# Shared-cache reuse of an Authorization request is unsafe unless the application
# has explicitly designed for it.  This also matches the official NGINX example.
map $http_authorization $proxy_skip_authorization {
    default 1;
    ""      0;
}

# Explicit application/operator opt-out cookies.  An empty value or literal 0 is
# false, matching the directive's native condition semantics.
map "$cookie_nocache:$cookie_no_cache:$cookie_cache_bypass" $proxy_skip_cookie {
    default          1;
    ~^0?:0?:0?$      0;
}

# Common framework, CMS and commerce login/session cookies.  Extend this list
# with the exact cookie names used by the local application; exact names are
# safer than bypassing every request that happens to carry a preference cookie.
map $http_cookie $proxy_skip_session_cookie {
    default 0;

    # PHP, Java, ASP.NET, Laravel, Express/Django and common auth-token names.
    "~*(?:^|;[\x20\x09]*)(?:PHPSESSID|JSESSIONID|ASP\.NET_SessionId|\.AspNetCore\.Session|laravel_session|connect\.sid|sessionid|session_id|auth_token|access_token|refresh_token|id_token|jwt|logged_in)=[^;]*" 1;

    # WordPress authenticated, password-protected and commenter cookies.
    "~*(?:^|;[\x20\x09]*)(?:wordpress_logged_in_[^=;]*|wordpress_sec_[^=;]*|wordpress_[0-9a-f]{32}|wp-postpass_[^=;]*|comment_author_[^=;]*)=[^;]*" 1;

    # WooCommerce cart and customer-session cookies.
    "~*(?:^|;[\x20\x09]*)(?:woocommerce_cart_hash|woocommerce_items_in_cart|wp_woocommerce_session_[^=;]*|woocommerce_recently_viewed|store_notice[^=;]*)=[^;]*" 1;
}


###############################################################################
# 3. Query-string cache controls and sensitive query parameters
###############################################################################

# Named opt-out arguments.  $arg_* matching is case-insensitive in NGINX.  Each
# component may be empty or 0 without triggering; any other value triggers.
# `comment` is retained because it appears in the official NGINX example.
map "$arg_nocache:$arg_no_cache:$arg_cache_bypass:$arg_comment" $proxy_skip_arg {
    default              1;
    ~^0?:0?:0?:0?$       0;
}

# Presence-only controls used by common CMS preview/customizer and commerce
# endpoints.  Empty values still trigger because the operation itself mutates or
# personalizes the response.  Add application-specific controls here.
map $args $proxy_skip_control_arg {
    default 0;
    ~*(?:^|&)(?:nocache|no_cache|cache_bypass|cache-bust|cache_bust|preview|preview_id|preview_nonce|customize_changeset_uuid|add-to-cart|wc-api|wc-ajax)(?:=|&|$) 1;
}

# Signed URLs, bearer-like query credentials and session identifiers should not
# be persisted in a shared cache.  Their responses may contain private data, and
# cache keys/logs would otherwise retain the secret-bearing query string.
map $args $proxy_skip_sensitive_arg {
    default 0;
    ~*(?:^|&)(?:access_token|refresh_token|id_token|api_key|apikey|authorization|auth|jwt|session|sessionid|session_id|signature|sig|token|x-amz-signature|x-amz-credential|x-amz-security-token|x-goog-signature|x-goog-credential|policy|key-pair-id)(?:=|&|$) 1;
}


###############################################################################
# 4. HTTP request cache directives (RFC 9111)
###############################################################################

# Pragma is a deprecated HTTP/1.0 compatibility mechanism.  Only the no-cache
# token is meaningful; unrelated Pragma values must not disable the cache.
map $http_pragma $proxy_request_pragma_no_cache {
    default 0;
    "~*(?:^|,)[\x20\x09]*no-cache[\x20\x09]*(?:,|$)" 1;
}

# no-cache and max-age=0 request revalidation bypass an existing fresh response,
# but they do not prohibit storing the newly fetched response.
map $http_cache_control $proxy_request_revalidate {
    default 0;
    "~*(?:^|,)[\x20\x09]*no-cache(?:[\x20\x09]*=[\x20\x09]*(?:\"[^\"]*\"|[^,]*))?[\x20\x09]*(?:,|$)" 1;
    "~*(?:^|,)[\x20\x09]*max-age[\x20\x09]*=[\x20\x09]*\"?0+\"?[\x20\x09]*(?:,|$)" 1;
}

# A request no-store directive prohibits storing the request or its response and
# therefore belongs to both the bypass and no-cache decisions.
map $http_cache_control $proxy_request_no_store {
    default 0;
    "~*(?:^|,)[\x20\x09]*no-store[\x20\x09]*(?:,|$)" 1;
}

# RFC request directives exposed as optional policy inputs.  NGINX does not turn
# these into all RFC behaviours automatically; applications may route or log on
# the variables without making every request a cache miss.
map $http_cache_control $proxy_request_only_if_cached {
    default 0;
    "~*(?:^|,)[\x20\x09]*only-if-cached[\x20\x09]*(?:,|$)" 1;
}

map $http_cache_control $proxy_request_accepts_stale {
    default 0;
    "~*(?:^|,)[\x20\x09]*max-stale(?:[\x20\x09]*=[\x20\x09]*\"?[0-9]+\"?)?[\x20\x09]*(?:,|$)" 1;
}

map $http_cache_control $proxy_request_min_fresh {
    default 0;
    "~*(?:^|,)[\x20\x09]*min-fresh[\x20\x09]*=[\x20\x09]*\"?[0-9]+\"?[\x20\x09]*(?:,|$)" 1;
}

map $http_cache_control $proxy_request_no_transform {
    default 0;
    "~*(?:^|,)[\x20\x09]*no-transform[\x20\x09]*(?:,|$)" 1;
}


###############################################################################
# 5. Sensitive/dynamic URI families
###############################################################################

# Conservative defaults for common authentication, account, administration and
# commerce routes.  Remove or override entries if the application intentionally
# publishes cacheable content below one of these prefixes.
map $uri $proxy_skip_sensitive_uri {
    default 0;

    # Generic administrative, identity and personalized account routes.
    ~*^/(?:admin|administrator|login|logout|signin|signout|signup|register|lost-password|account|profile|user|users|oauth|oauth2|auth|session)(?:/|$) 1;

    # WordPress administrative/dynamic entry points.
    ~*^/(?:wp-admin|wp-login\.php|wp-register\.php|wp-mail\.php|wp-cron\.php|wp-comments-post\.php|xmlrpc\.php)(?:/|$) 1;

    # Shopping-cart, payment and WooCommerce dynamic endpoints.
    ~*^/(?:cart|basket|checkout|payment|my-account|wc-api|wc-ajax)(?:/|$) 1;
}


###############################################################################
# 6. Optional strict-policy helpers (not enabled by the final maps)
###############################################################################

# These are intentionally opt-in.  Globally bypassing every cookie, query string,
# Range request or AJAX request is safe but can destroy cache effectiveness.
map $http_cookie $proxy_has_cookie {
    default 1;
    ""      0;
}

map $is_args $proxy_has_query_string {
    default 1;
    ""      0;
}

map $http_range $proxy_has_range {
    default 1;
    ""      0;
}

map $http_x_requested_with $proxy_is_ajax {
    default            0;
    ~*^XMLHttpRequest$ 1;
}

map $http_origin $proxy_has_origin {
    default 1;
    ""      0;
}


###############################################################################
# 7. Upstream response conditions for proxy_no_cache
###############################################################################

# NGINX already honours X-Accel-Expires, Expires, Cache-Control, Set-Cookie and
# Vary while processing an upstream response unless proxy_ignore_headers disables
# that behaviour.  The explicit flags below document the policy, cover defensive
# configurations and can be logged individually.
map $upstream_http_cache_control $proxy_response_cache_control_no_store {
    default 0;
    "~*(?:^|,)[\x20\x09]*(?:no-cache|no-store|private)(?:[\x20\x09]*=[\x20\x09]*(?:\"[^\"]*\"|[^,]*))?[\x20\x09]*(?:,|$)" 1;
    "~*(?:^|,)[\x20\x09]*(?:s-maxage|max-age)[\x20\x09]*=[\x20\x09]*\"?0+\"?[\x20\x09]*(?:,|$)" 1;
}

map $upstream_http_set_cookie $proxy_response_sets_cookie {
    default 1;
    ""      0;
}

map $upstream_http_vary $proxy_response_vary_star {
    default 0;
    "~*(?:^|,)[\x20\x09]*\*[\x20\x09]*(?:,|$)" 1;
}

map $upstream_http_x_accel_expires $proxy_response_x_accel_expires_zero {
    default 0;
    ~^0+$   1;
}

# X-Accel-Buffering: no disables proxy response buffering.  NGINX cannot cache a
# response while buffering is disabled, so expose it as an explicit no-cache flag.
map $upstream_http_x_accel_buffering $proxy_response_buffering_disabled {
    default 0;
    ~*^no$  1;
}

# Surrogate-Control and CDN-Cache-Control are shared-cache conventions that the
# stock proxy module does not interpret as cache lifetime controls by itself.
map $upstream_http_surrogate_control $proxy_response_surrogate_no_store {
    default 0;
    "~*(?:^|,)[\x20\x09]*(?:no-cache|no-store|private)[\x20\x09]*(?:,|$)" 1;
    "~*(?:^|,)[\x20\x09]*(?:s-maxage|max-age)[\x20\x09]*=[\x20\x09]*\"?0+\"?[\x20\x09]*(?:,|$)" 1;
}

map $upstream_http_cdn_cache_control $proxy_response_cdn_no_store {
    default 0;
    "~*(?:^|,)[\x20\x09]*(?:no-cache|no-store|private)[\x20\x09]*(?:,|$)" 1;
    "~*(?:^|,)[\x20\x09]*(?:s-maxage|max-age)[\x20\x09]*=[\x20\x09]*\"?0+\"?[\x20\x09]*(?:,|$)" 1;
}

# Authentication failures and challenges are normally outside the default cached
# status set.  These guards remain useful if proxy_cache_valid ... any is enabled.
map $upstream_status $proxy_response_auth_error {
    default 0;
    401     1;
    403     1;
}

map $upstream_http_www_authenticate $proxy_response_auth_challenge {
    default 1;
    ""      0;
}

# Optional response diagnostics, deliberately not part of the default decision.
map $upstream_status $proxy_response_partial_content {
    default 0;
    206     1;
}

map $upstream_http_expires $proxy_response_has_expires {
    default 1;
    ""      0;
}


###############################################################################
# 8. Final purpose-specific variables
###############################################################################

# Conditions that prohibit using an existing cached response.  Request no-cache,
# Pragma no-cache and max-age=0 are included here as revalidation/cache-bust
# signals, but they are intentionally absent from $proxy_no_cache_request.
map "$proxy_skip_method:$proxy_skip_request_body:$proxy_skip_upgrade:$proxy_skip_authorization:$proxy_skip_cookie:$proxy_skip_session_cookie:$proxy_skip_arg:$proxy_skip_control_arg:$proxy_skip_sensitive_arg:$proxy_skip_sensitive_uri:$proxy_request_pragma_no_cache:$proxy_request_revalidate:$proxy_request_no_store" $proxy_cache_bypass_flag {
    default 0;
    ~1      1;
}

# Request conditions that also prohibit saving the newly fetched response.
map "$proxy_skip_method:$proxy_skip_request_body:$proxy_skip_upgrade:$proxy_skip_authorization:$proxy_skip_cookie:$proxy_skip_session_cookie:$proxy_skip_arg:$proxy_skip_control_arg:$proxy_skip_sensitive_arg:$proxy_skip_sensitive_uri:$proxy_request_no_store" $proxy_no_cache_request {
    default 0;
    ~1      1;
}

# Upstream response conditions that prohibit storage.  This composition is read
# by proxy_no_cache after the upstream response headers are available.
map "$proxy_response_cache_control_no_store:$proxy_response_sets_cookie:$proxy_response_vary_star:$proxy_response_x_accel_expires_zero:$proxy_response_buffering_disabled:$proxy_response_surrogate_no_store:$proxy_response_cdn_no_store:$proxy_response_auth_error:$proxy_response_auth_challenge" $proxy_no_cache_response {
    default 0;
    ~1      1;
}

map "$proxy_no_cache_request:$proxy_no_cache_response" $proxy_no_cache_flag {
    default 0;
    ~1      1;
}


###############################################################################
# 9. Backward-compatible variable used by the current nginx.conf
###############################################################################

# Current call site:
#     proxy_cache_bypass $proxy_skip_cache;
#     proxy_no_cache     $proxy_skip_cache;
#
# It intentionally preserves the older "same request conditions for both"
# behaviour.  To apply the response-side extensions and correct read/write split,
# use $proxy_cache_bypass_flag and $proxy_no_cache_flag at the call site.
map $proxy_cache_bypass_flag $proxy_skip_cache {
    default 0;
    1       1;
}
