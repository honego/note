##############################
# WebSocket Connection 头, 避免普通请求也强制 Connection: upgrade
# https://freenginx.org/en/docs/http/websocket.html
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

##############################
# 静态资源兜底缓存策略, 仅在上游未提供缓存策略时由 Lua 应用
map $uri $static_cache_control {
    default '';

    # 框架明确的不可变构建目录, 资源生命周期由构建系统管理
    # Next.js: /_next/static/
    # SvelteKit: /_app/immutable/
    '~^/(?:_next/static|_app/immutable)/' 'public, max-age=31536000, immutable';

    # 框架构建目录中的指纹资源
    # Nuxt: /_nuxt/DC5HVSK5.js
    # Astro: /_astro/index.DRf8L97S.js
    '~^/(?:_nuxt|_astro)/(?:.*/)?(?:[^/]+[-._~])?[A-Za-z0-9_-]{8,64}\.(?:(?:css|js|mjs|cjs)(?:\.map)?|map|wasm|woff2?|ttf|otf|eot|svg|ico|cur|png|jpe?g|gif|webp|avif|apng|bmp|mp3|mp4|m4a|aac|oga|ogg|ogv|opus|webm|flac|pdf)$' 'public, max-age=31536000, immutable';

    # 通用前端构建目录中的指纹资源
    # Vite/Rollup: /assets/index-BmbyAd75.css
    # Webpack/CRA: /static/js/main.8f3a1c2d.js
    '~^/(?:assets|static/(?:js|css|media))/.+[-._~][A-Za-z0-9_-]{8,64}\.(?:(?:css|js|mjs|cjs)(?:\.map)?|map|wasm|woff2?|ttf|otf|eot|svg|ico|cur|png|jpe?g|gif|webp|avif|apng|bmp|mp3|mp4|m4a|aac|oga|ogg|ogv|opus|webm|flac|pdf)$' 'public, max-age=31536000, immutable';
}

##############################
# https://blog.nginx.org/blog/nginx-introduces-support-103-early-hints
# 仅浏览器主导航请求 + HTTP/2/HTTP/3 才透传上游 103 Early Hints
map $http_sec_fetch_mode $early_hints {
    navigate $http2$http3;
}
