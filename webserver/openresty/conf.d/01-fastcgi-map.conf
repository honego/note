##############################
# FastCGI 缓存绕过条件

map $request_method $fastcgi_skip_method {
    default 1;
    GET     0;
    HEAD    0;
}

map $cookie_nocache $fastcgi_skip_cookie {
    default 1;
    ''      0;
    '0'     0;
}

map "$arg_nocache$arg_comment" $fastcgi_skip_args {
    default 1;
    ''      0;
    '0'     0;
}

map $http_pragma $fastcgi_skip_pragma {
    default                                        0;
    ~*(?:^|,)[\x20\x09]*no-cache[\x20\x09]*(?:,|$) 1;
}

map $http_authorization $fastcgi_skip_authorization {
    default 1;
    ''      0;
}

map $http_cache_control $fastcgi_skip_cache_control {
    default                                                                                      0;
    ~*(?:^|,)[\x20\x09]*(?:no-cache|no-store|max-age[\x20\x09]*=[\x20\x09]*0+)[\x20\x09]*(?:,|$) 1;
}

map $http_cookie $fastcgi_skip_session_cookie {
    default 0;
    "~*(?:^|;[\x20\x09]*)(?:PHPSESSID|JSESSIONID|ASP\.NET_SessionId|\.AspNetCore\.Session|laravel_session|connect\.sid|sessionid)[\x20\x09]*=" 1;
    "~*(?:^|;[\x20\x09]*)(?:wordpress_logged_in_[^=;]+|wordpress_sec_[^=;]+|wordpress_[a-f0-9]+|wp-postpass_[^=;]+|comment_author_[^=;]+)[\x20\x09]*=" 1;
    "~*(?:^|;[\x20\x09]*)(?:woocommerce_cart_hash|woocommerce_items_in_cart|wp_woocommerce_session_[^=;]+|woocommerce_recently_viewed)[\x20\x09]*=" 1;
}

map "$fastcgi_skip_method:$fastcgi_skip_cookie:$fastcgi_skip_args:$fastcgi_skip_pragma:$fastcgi_skip_authorization:$fastcgi_skip_cache_control:$fastcgi_skip_session_cookie" $fastcgi_skip_cache {
    default 0;
    ~1      1;
}
