server {
    listen       80;
    listen       [::]:80;
    server_name  zhaolei.example.com;
    return 301   https://$host$request_uri;
}

server {
    listen       443 ssl;
    listen       [::]:443 ssl;
    listen       443 quic;
    listen       [::]:443 quic;
    server_name  zhaolei.example.com;

    ssl_certificate      /etc/nginx/certs/example.com_fullchain.pem;
    ssl_certificate_key  /etc/nginx/certs/example.com_key.pem;

    resolver 8.8.8.8 1.1.1.1 valid=30s ipv6=off;
    resolver_timeout 5s;

    client_max_body_size 1m;
    add_header_inherit merge; # 合并继承上级配置中的 add_header, 仅对 add_header 指令生效, 该指令出现在版本 1.29.3 中
    more_set_headers 'Alt-Svc: h3=":443"; ma=86400';

    # 访问控制
    # access_by_lua_file /etc/nginx/lua/access/entry.lua;

##############################
    # https://nginx.org/en/docs/http/ngx_http_autoindex_module.html
    location / {
        autoindex on;
        autoindex_exact_size on;
        autoindex_format html;
        autoindex_localtime off;
    }

    location ~ (^|/)\. {
        return 444;
    }

    location = /favicon.ico {
        root /usr/local/openresty/nginx/html;
        access_log off;
        log_not_found off;
    }

    location = /robots.txt {
        root /usr/local/openresty/nginx/html;
        allow all;
        log_not_found off;
        access_log off;
    }

##############################
# internal html.
    error_page 403 /403.html;
    location = /403.html {
        root /usr/local/openresty/nginx/html;
        internal;
    }

    error_page 404 /404.html;
    location = /404.html {
        root /usr/local/openresty/nginx/html;
        internal;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/local/openresty/nginx/html;
        internal;
    }
}
