# /usr/local/openresty/nginx/conf/nginx.conf

load_module modules/ngx_http_acme_module.so;
load_module modules/ngx_http_brotli_filter_module.so;
load_module modules/ngx_http_brotli_static_module.so;
load_module modules/ngx_http_geoip2_module.so;
load_module modules/ngx_stream_geoip2_module.so;
load_module modules/ngx_http_zstd_filter_module.so;
load_module modules/ngx_http_zstd_static_module.so;

##############################
# https://nginx.org/en/docs/ngx_core_module.html
user nginx nginx; # 设置 worker 进程运行的用户和组, NGINX 源码默认 nobody nobody, 实际默认值可由构建参数覆盖
worker_processes auto; # 设置工作进程数量, 通常为CPU核心数

pcre_jit on; # 允许使用 JIT 来加速正则表达式的处理

# 设置原则: 需与 worker_connections 配合, 应高于其配置值并根据实际并发量预留足够的文件描述符余量
worker_rlimit_nofile  65535; # 指定每个工作进程可打开的最大文件描述符数量

# 定义默认线程池, 用于 aio threads 处理文件 I/O 任务
# threads: 工作线程数, 按 CPU 和 I/O 负载适当调整; max_queue: 最大等待任务数, 防止任务无限堆积
thread_pool default threads=16 max_queue=65536;

# 使用 eBPF 路由 QUIC 数据包, 用于多 worker 场景下支持 QUIC 连接迁移
# 该指令仅支持 Linux 5.7+
# quic_bpf on;

error_log  /usr/local/openresty/nginx/logs/error.log error;
pid        /run/nginx.pid;

events {
    use epoll; # 使用 epoll 事件模型, Linux 下通常会自动选择最高效的事件处理方法

    # 控制 worker 是否一次接受所有等待的新连接, 提高突发连接的接受速度适合高连接建立速率场景, 建议结合实际负载压测
    # multi_accept on;

    # https://docs.nginx.com/nginx-gateway-fabric/how-to/scaling
    # 设置每个 worker 可同时打开的最大连接数, 包括客户端和上游连接, 默认值 512
    # 根据实际并发量和 worker_rlimit_nofile 调整, 反向代理场景需为上游连接预留容量
    worker_connections 8192;
}

http {
    include       /usr/local/openresty/nginx/conf/mime.types;
    default_type  application/octet-stream;
    charset       utf-8; # 响应内容的字符编码

    lua_package_path "/etc/nginx/lua/?.lua;/usr/local/openresty/lualib/?.lua;;"; # Lua 模块
    lua_package_cpath "/usr/local/openresty/lualib/?.so;;"; # C 模块

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    # https://con.openresty.org/cn/2018/ppt/%E5%8F%88%E6%8B%8D%E4%BA%91%E6%9C%8D%E5%8A%A1%E4%BC%98%E5%8C%96%E5%AE%9E%E8%B7%B5--%E5%BC%A0%E8%B6%85.pdf
    # 缓冲 access log 写入, 减少频繁磁盘 I/O
    # buffer: 日志缓冲区大小; flush: 缓冲日志最长等待写入时间
    access_log /usr/local/openresty/nginx/logs/access.log main buffer=32k flush=10s;

##############################
    ## https://nginx.org/en/docs/http/ngx_http_core_module.html
    chunked_transfer_encoding on; # 控制 HTTP/1.1 响应是否使用分块传输编码, 默认 on, 通常保持开启

    # https://blog.cloudflare.com/delivering-http-2-upload-speed-improvements
    client_body_buffer_size 256k; # 客户端请求体缓冲区, 超出后可能写入临时文件, 适当增大可减少磁盘 I/O 并改善 HTTP/2 上传

    # https://www.plesk.com/blog/various/nginx-performance-tuning-tips
    client_body_timeout 30s; # 客户端请求体相邻读操作的超时时间, 默认 60s, 可适当收紧, 上传或弱网场景按需放宽
    client_header_buffer_size 1k; # 客户端请求头基础缓冲区, 默认 1k, 超出后按需使用 large_client_header_buffers
    client_header_timeout 30s; # 客户端完整请求头的读取超时时间, 默认 60s, 可适当收紧以释放慢连接, 弱网或复杂代理链路按需放宽
    client_max_body_size 8m; # 限制客户端请求体大小, 默认 1m, 超出返回 413, 0 表示关闭检查, 大文件上传等场景应单独放宽

    # 用于为静态资源自动生成 ETag 响应头, 默认 on, 可与 Last-Modified 配合进行缓存校验, 命中时返回 304 以减少传输
    # 仅影响 NGINX 直接提供的静态资源, 不控制上游应用返回的 ETag; 多节点部署需保持静态文件版本和元数据一致
    # 通用配置建议保持 on, 如果完全依赖文件名指纹、强 Cache-Control 或 CDN 缓存策略, 可按需关闭
    etag on;

    # 控制是否忽略名称非法的请求头字段, 默认 on; 下划线请求头由 underscores_in_headers 控制
    # 通用配置建议保持 on, 仅在明确需要兼容特殊请求头时关闭
    ignore_invalid_headers on;

    # 设置 keep-alive 客户端连接的最小保留时间, 默认 0, NGINX 1.27.4+ 支持
    # 可减少连接复用或 worker 优雅退出时的 TCP RST, 有平滑升级需求时可按需设置
    keepalive_min_timeout 0;

    # https://mailman.nginx.org/pipermail/nginx-announce/2021/000296.html
    # 设置单个 keep-alive 连接可处理的最大请求数, 达到上限后关闭连接以释放每连接内存, 不宜设置过高
    # 默认 1000, NGINX 1.19.10 前默认 100; 通用生产环境保持默认即可
    keepalive_requests 1000;

    # 限制单个 keep-alive 连接的最长存活时间, 默认 1h, NGINX 1.19.10+ 支持
    # 达到时间后在后续请求处理完成后关闭连接, 与 keepalive_timeout 的空闲超时不同
    keepalive_time 1h;

    # 设置客户端 keep-alive 空闲连接的保留时间, 默认 75s, 0 表示禁用连接复用
    # 通用生产环境保持默认即可; 高连接压力或安全加固场景可适当收紧
    keepalive_timeout 75s;

    # 用于读取超出 client_header_buffer_size 的大请求头, 默认 4 8k, 按需分配并在连接进入 keep-alive 后释放
    # 请求行或单个请求头字段不能超过单个 buffer; 长 Cookie、Authorization/JWT 等场景可在对应 server 按需增大
    large_client_header_buffers 4 8k;

    # 限制单个请求向客户端发送响应的速率, 默认 0 表示不限速, 单位为字节/秒, 并发请求的总速率会叠加
    # 可在具体 location 按需限速; 上游可通过 X-Accel-Limit-Rate 动态设置, 可用 proxy_ignore_headers 忽略
    limit_rate 0;

    # 设置响应开始限速前允许先发送的数据量, 默认 0, 需配合 limit_rate 使用
    # 下载、视频或镜像等场景可按需放行部分数据后再限速, 通用配置保持 0
    limit_rate_after 0;

    # 控制关闭客户端连接前是否继续读取并丢弃剩余数据, 默认 on, off 会立即关闭连接并可能破坏协议
    # 通用配置保持 on; NGINX 1.19.1+ 支持 HTTP/2, HTTP/2 场景需在 server 级配置才生效
    lingering_close on;
    lingering_time 30s; # 限制 lingering_close 生效时读取并丢弃客户端剩余数据的最长时间, 默认 30s, 通常与 lingering_close 和 lingering_timeout 配合使用
    lingering_timeout 5s; # 设置 lingering_close 生效时等待客户端剩余数据的单次超时时间, 默认 5s, 超时无数据则关闭连接; 收到数据后读取并丢弃, 总处理时间受 lingering_time 限制

    log_not_found on; # 控制本地文件不存在时是否记录到 error_log, 默认 on, 通常保持开启, 高频无效路径可在对应 location 关闭
    log_subrequest off; # 控制是否将子请求写入 access_log, 默认 off, 通常保持关闭, 调试 auth_request、mirror 或 Lua 子请求时可临时开启

    msie_padding off; # 控制是否为旧浏览器的错误响应追加填充内容至约 512 字节, 默认 on, 属于历史兼容机制, 现代环境通常无需该兼容行为, 建议关闭以避免无意义的响应填充

    # 缓存打开的文件描述符、文件元数据和目录信息, 默认 off, 可减少静态资源和 try_files 的 open/stat 系统调用
    # max: 最大缓存条目数, 超出按 LRU 淘汰, inactive: 未访问条目的保留时间, 文件变更检查由 open_file_cache_valid 控制
    open_file_cache max=2000 inactive=30s;
    open_file_cache_errors on; # 缓存文件查找错误, 如文件不存在或无读取权限, 减少对缺失静态资源的重复 open/stat 查询
    open_file_cache_min_uses  2; # 设置 inactive 周期内文件描述符保持打开所需的最小访问次数, 默认 1, 适当提高可减少低频文件占用
    open_file_cache_valid 60s; # 设置 open_file_cache 缓存项的重新校验周期, 默认 60s, 周期越长可减少 stat/open 检查但会降低文件变更感知速度

    # 对超时连接和 return 444 关闭的连接发送 TCP RST, 默认 off, 可立即释放 socket 资源并减少 FIN_WAIT1 占用
    # NGINX 1.15.2+ 支持 444 连接重置; 公网服务或大量使用 444 的场景可开启
    reset_timedout_connection on;

    # 用于运行时 DNS 解析, 常见于 ACME、OCSP、动态 upstream、变量 proxy_pass 和 Lua / NJS 外部请求
    # valid 控制 DNS 缓存时间; ipv6=off 禁用 AAAA 查询, DNS 服务器应优先使用可信的本地解析器
    resolver 8.8.8.8 1.1.1.1 valid=30s ipv6=off;
    # resolver 127.0.0.11 valid=30s ipv6=off;
    # resolver 223.5.5.5 119.29.29.29 valid=30s ipv6=off;
    resolver_timeout 5s; # 设置 DNS 解析超时时间, 默认 30s, 超时后解析失败, 通常可适当收紧以避免请求长时间等待, 公网或 Docker / 内网 DNS 可根据解析器稳定性调整, 通用生产配置可设为 5s

    send_timeout 60s; # 设置向客户端发送响应的相邻写操作超时时间, 默认 60s, 不是完整响应传输总耗时, 通用配置保持默认即可, 慢客户端较多或需快速释放连接时可按需收紧
    sendfile on; # 使用 sendfile() 发送本地文件, 默认 off, 可减少用户态拷贝并提升静态资源和下载响应效率
    sendfile_max_chunk 2m; # 限制单次 sendfile() 最大发送量, NGINX 1.21.4+ 默认 2m, 可避免高速连接长时间独占 worker

    # server_names_hash_bucket_size 64; # 设置服务器名称哈希表中每个"桶" (Bucket) 的大小, 默认值取决于处理器缓存行的大小
    # server_names_hash_max_size 512; # 默认 512, 仅在大量 server_name 导致 hash 构建失败时按需增大
    server_tokens off; # 隐藏错误页和 Server 响应头中的 NGINX 版本信息, 默认 on, 生产环境建议关闭

    tcp_nodelay on; # 启用 TCP_NODELAY, 默认 on, 可减少 keep-alive、SSL、WebSocket 和非缓冲代理场景的小包发送延迟
    tcp_nopush on; # 配合 sendfile 启用 TCP_NOPUSH/TCP_CORK, 可合并响应头与文件开头并提升静态文件发包效率

    underscores_in_headers off; # 控制是否允许请求头字段名包含下划线, 默认 off, 通常保持关闭, 仅在明确兼容非标准请求头时开启

##############################
    ## https://nginx-extras.getpagespeed.com/zh/modules/zstd
    # zstd on; # 启用 Zstandard 响应压缩
    # zstd_comp_level 3; # 设置 Zstandard 压缩级别, 模块默认 1, 级别越高压缩率通常越高但 CPU 开销越大, 通用生产配置建议 3
    # zstd_min_length 1k; # 设置启用 Zstandard 压缩的最小响应大小, 默认 20, 小响应压缩收益有限, 通用生产配置可适当提高
    # # zstd_buffers 32 4k; # 设置 Zstandard 压缩缓冲区数量和大小, 默认按系统页大小为 32 4k 或 16 8k
    # zstd_static on; # 启用预压缩 .zst 静态文件, 默认 off, 客户端支持 zstd 且存在对应文件时直接发送
    # zstd_types
    #     text/plain text/css text/javascript text/xml text/wgsl
    #     application/javascript application/json application/ld+json
    #     application/manifest+json application/xml
    #     application/rss+xml application/atom+xml
    #     application/vnd.api+json application/xhtml+xml application/wasm
    #     image/svg+xml;

##############################
    ## https://github.com/google/ngx_brotli
    # brotli_static on; # 启用预压缩 .br 静态文件, 默认 off, 客户端支持 Brotli 且存在对应文件时直接发送
    # brotli on; # 启用 Brotli 动态响应压缩, 默认 off
    # brotli_comp_level 6; # 设置 Brotli 动态压缩等级, 默认 6, 范围 0~11; 级别越高压缩率通常越高但 CPU 开销越大
    # brotli_window 512k; # Brotli 滑动窗口大小, 默认 512k, 增大可能提高大响应压缩率, 但会增加内存开销
    # brotli_min_length 1k; # 设置 Brotli 动态压缩的最小响应大小, 默认 20, 适当提高可避免压缩过小响应带来的额外 CPU 开销
    # brotli_types
    #     text/plain text/css text/javascript text/xml text/wgsl
    #     application/javascript application/json application/ld+json
    #     application/manifest+json application/xml
    #     application/rss+xml application/atom+xml
    #     application/vnd.api+json application/xhtml+xml application/wasm
    #     image/svg+xml;

##############################
    ## https://nginx.org/en/docs/http/ngx_http_gzip_module.html
    ## https://en.angie.software/angie/docs/configuration/modules/http/http_gzip_static
    gzip on; # 开启Gzip压缩, 减小传输内容大小提高页面加载速度
    gzip_static on; # 启用预压缩 .gz 静态文件发送, 默认 off, 客户端支持 gzip 且存在对应文件时直接发送, 原文件与 .gz 建议保持相同修改时间以确保 Last-Modified / 缓存校验一致
    # gzip_buffers 32 4k; # gzip 压缩缓冲区, 默认按系统页大小为 32 4k 或 16 8k, 通常无需显式配置 (getconf PAGE_SIZE 获取默认值)
    gzip_comp_level 4; # 设置 gzip 动态压缩级别, 默认 1, 范围 1~9, 级别越高压缩率通常越高但 CPU 开销越大
    gzip_http_version  1.1; # 设置压缩响应所需的最低 HTTP 请求版本

    # https://docs.nginx.com/nginx/admin-guide/web-server/compression
    gzip_min_length 1k; # 设置 gzip 动态压缩的最小响应大小, 默认 20, 仅根据 Content-Length 判断, 可避免压缩过小响应的额外开销
    gzip_proxied expired no-cache no-store private auth; # 控制带 Via 请求头的代理请求 gzip, 默认 off, 通常仅压缩不可缓存、私有或带 Authorization 的响应
    gzip_types
        text/plain text/css text/javascript text/xml text/wgsl
        application/javascript application/json application/ld+json
        application/manifest+json application/xml
        application/rss+xml application/atom+xml
        application/vnd.api+json application/xhtml+xml application/wasm
        image/svg+xml;
    gzip_vary on; # 在 gzip/gzip_static/gunzip 生效时添加 Vary: Accept-Encoding, 默认 off, 让 CDN / 代理按压缩能力区分缓存版本, 避免代理缓存混用压缩与未压缩响应

##############################
    ## https://nginx.org/en/docs/http/ngx_http_v3_module.html
    http3 on;
    http3_hq off;
    http3_max_concurrent_streams 256; # 限制单个 HTTP/3 连接可同时处理的请求流数量, 默认 128, 可适当提高以支持更多并发请求
    http3_stream_buffer_size 128k; # 设置 HTTP/3 QUIC stream 的读写缓冲区大小, 默认 64k, 适当增大可改善高吞吐场景但会增加潜在内存占用
    quic_active_connection_id_limit 4; # 设置单个 QUIC 连接可维护的最大活跃 Connection ID 数量, 默认 2, 连接迁移场景可适当增加
    quic_gso on; # 启用 QUIC UDP GSO 批量发送, 默认 off, 可降低发送开销并提升 HTTP/3 吞吐, 需 Linux UDP_SEGMENT 支持
    quic_retry on; # 启用 QUIC 地址验证, 默认 off, 可降低源地址伪造、流量放大和握手 DoS 风险, 代价是首次连接增加一次 RTT

##############################
    ## https://nginx.org/en/docs/http/ngx_http_v2_module.html
    # https://blog.cloudflare.com/delivering-http-2-upload-speed-improvements
    http2 on;
    http2_body_preread_size 128k; # 设置 HTTP/2 请求体预读大小和 stream 初始接收窗口, 默认 64k, 适当增大可改善高带宽、高 RTT 上传吞吐
    http2_chunk_size 16k; # 设置 HTTP/2 响应体的最大切片大小, 默认 8k, 16k 为实际最大值, 增大可降低发送开销但可能影响多 stream 优先级调度
    http2_max_concurrent_streams 256; # 限制单个 HTTP/2 连接允许同时处理的最大 stream 数量, 默认 128, 适当提高可增强单连接并发能力但会增加潜在资源占用
    http2_recv_buffer_size 256k; # 设置每个 worker 的 HTTP/2 输入缓冲区大小, 默认 256k, 通用生产环境保持默认即可

##############################
    ## https://nginx.org/en/docs/http/ngx_http_acme_module.html
    # 定义 ACME 证书签发机构, 供 acme_certificate 引用, 仅支持在 http 上下文配置
    # acme_issuer letsencrypt {
    #     uri https://acme-v02.api.letsencrypt.org/directory; # 设置 ACME 服务器的 directory URL, 该参数为必填项, 用于发现账户注册、验证和证书签发等 API 端点
    #     challenge http-01; # 使用 HTTP-01 完成 ACME 域名验证, 默认方式, 需确保外部可通过 80 端口访问验证路径
    #     # contact admin@example.com; # 设置 ACME 账户联系地址, 供 CA 在账户或证书异常时联系, 未指定 scheme 时默认使用 mailto
    #     ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt; # 使用 Alpine ca-certificates-bundle 提供的系统 CA 证书库, 用于验证 ACME 服务器的 TLS 证书
    #     ssl_verify on; # 验证 ACME 服务器的 TLS 证书, 默认 on, 生产环境应保持开启并配合可信 CA 证书库使用
    #     state_path /etc/nginx/certs/acme_letsencrypt; # 设置 ACME 状态持久化目录, 保存账户密钥、证书和私钥, Docker 环境应挂载持久化存储避免容器重建后丢失
    #     accept_terms_of_service; # 接受 ACME CA 的服务条款, 部分 CA 在账户注册前要求显式同意, 条款地址会在需要时写入 error_log
    # }
    # acme_shared_zone zone=ngx_acme_shared:1m; # 设置 ACME 模块共享内存区, 保存证书、私钥和 challenge 数据供 worker 共享, 默认 256k

##############################
    ## https://nginx.org/en/docs/http/ngx_http_ssl_module.html
    ssl_buffer_size 8k; # 设置 SSL/TLS 响应数据的发送缓冲区大小, NGINX 默认 16k, 16k 更偏大响应吞吐, 4k 更偏降低 TTFB, ingress-nginx 默认使用 4k, 8k 作为折中值, 可兼顾响应延迟和大响应传输开销
    ssl_certificate_cache max=2000 inactive=20s valid=1m; # 缓存通过变量动态加载的 SSL 证书和私钥, 默认 off, max 按证书和私钥分别计数并按 LRU 淘汰, inactive 默认 10s, valid 默认 60s
    ssl_certificate_compression on; # 启用 TLS 1.3 服务器证书压缩, 默认 off, NGINX 1.29.1+ 引入, 可减少证书链握手数据量并降低首次 TLS 建连开销

    # https://www.ssl.org/server-config-generator#server=nginx&version=1.27.3&config=intermediate&openssl=3.6.1&hsts&guideline=6.0
    # https://kubernetes.github.io/ingress-nginx/user-guide/nginx-configuration/configmap/#ssl-ciphers
    # Mozilla Guideline v6.0 Intermediate, 仅保留 ECDHE + AEAD 密码套件, TLS 1.3 不受该指令控制
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_ecdh_curve auto; # 使用 OpenSSL 内置 TLS group 列表, 默认 auto, OpenSSL 3.5+ 默认优先支持 X25519MLKEM768

    # https://github.com/mozilla/server-side-tls/issues/260
    # https://trac.nginx.org/nginx/ticket/1942
    ssl_prefer_server_ciphers off; # 使用客户端优先顺序选择服务端允许的安全 TLS 参数, 默认 off, Mozilla Guideline v6.0 同样采用该配置

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m; # 启用 worker 间共享的 TLS 会话缓存, 减少重复完整握手的 CPU 开销

    # https://github.com/mozilla/server-side-tls/issues/135
    ssl_session_tickets off; # 禁用无状态 TLS Session Ticket, 默认 on, 配合 ssl_session_cache 保留会话恢复并减少 ticket_key 带来的长期密钥风险
    ssl_session_timeout 1d; # 设置客户端可复用 TLS 会话参数的最长时间, 默认 5m, Mozilla/TLSRef 和 NixOS 生产 TLS 基线使用 1d

    # https://letsencrypt.org/2024/12/05/ending-ocsp
    ssl_stapling off; # 控制服务器是否附带 OCSP 状态响应, 默认 off, Let's Encrypt 已停止 OCSP 服务, 当前无需开启
    # ssl_stapling_verify off; # 用于验证 OCSP Stapling 响应的签名和证书链, 默认 off, 仅在启用 ssl_stapling 时使用
    # ssl_verify_client off; # 控制是否验证客户端 TLS 证书, 默认 off, 仅在启用 mTLS 客户端证书认证时需要调整

##############################
    ## https://nginx.org/en/docs/http/ngx_http_headers_module.html
    ## https://nginx-extras.getpagespeed.com/zh/modules/security-headers
    # add_header Content-Security-Policy "default-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'self'; form-action 'self'" always; # 限制资源加载, 页面嵌入, 表单提交和危险对象
    # add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always; # 禁止使用不需要的定位, 摄像头和麦克风权限
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always; # 强制当前域名及其子域仅通过 HTTPS 访问
    # add_header X-Content-Type-Options "nosniff" always; # 禁止浏览器进行 MIME 类型嗅探
    # add_header Referrer-Policy "strict-origin-when-cross-origin" always; # 同源发送完整 URL, 跨源仅发送 Origin, HTTPS 降级到 HTTP 时不发送
    # add_header X-Frame-Options "SAMEORIGIN" always; # 仅允许同源页面通过 frame 嵌入
    add_header_inherit merge; # 合并继承父级 add_header, 防止新增响应头时丢失全局安全响应头, 默认 on, NGINX 1.29.3+ 支持

    ## https://github.com/openresty/headers-more-nginx-module
    more_clear_headers 'Server' 'X-Powered-By' 'X-AspNet-Version' 'X-AspNetMvc-Version' 'X-Generator'; # 清理可能暴露服务端技术栈的响应头, 适用于 NGINX 和上游应用返回的响应
    # more_set_headers 'Server: Apache'; # 自定义 Server 响应头
    more_set_headers "Strict-Transport-Security: max-age=31536000; includeSubDomains";
    more_set_headers "X-Content-Type-Options: nosniff";
    more_set_headers "Referrer-Policy: strict-origin-when-cross-origin";
    more_set_headers "X-Frame-Options: SAMEORIGIN";

##############################
    ## https://nginx.org/en/docs/http/ngx_http_limit_conn_module.html
    limit_conn_zone $binary_remote_addr zone=addr:20m; # 定义按客户端 IP 统计的连接限制共享内存区, 无默认值, 具体限制由 server/location 的 limit_conn 启用
    # limit_conn addr 200; # 限制单个客户端 IP 的并发请求数, 无默认值
    limit_conn_log_level error; # 设置连接超限日志级别
    limit_conn_status 503; # 设置连接数超限时返回的 HTTP 状态码, 默认 503

##############################
    ## https://nginx.org/en/docs/http/ngx_http_limit_req_module.html
    limit_req_zone $binary_remote_addr zone=one:20m rate=50r/s; # 定义按客户端 IP 统计的请求速率限制共享内存区, 官方无默认值
    # limit_req zone=one burst=200 nodelay; # 限制请求速率并允许短时突发请求立即处理, 官方无默认值
    limit_req_log_level error; # 设置请求限速拒绝和延迟事件的日志级别
    limit_req_status 429; # 设置请求速率超限时返回的 HTTP 状态码, 默认 503

##############################
    ## https://nginx.org/en/docs/http/ngx_http_fastcgi_module.html
    fastcgi_buffer_size 16k; # 设置读取 FastCGI 响应头首部数据的缓冲区大小, 默认 4k|8k, 即一个内存页, 仅在上游响应头过大时增大
    fastcgi_buffering on; # 启用 FastCGI 响应缓冲, 默认 on
    fastcgi_buffers 8 16k; # 设置单个 FastCGI 连接读取响应的缓冲区数量和大小, 默认 8 个缓冲区, 单个缓冲区默认为一个内存页, 通常为 4k 或 8k
    fastcgi_busy_buffers_size 32k; # 设置向客户端发送响应时可同时占用的 FastCGI busy buffer 总大小, 默认 8k|16k
    # fastcgi_cache fastcgi; # 指定 FastCGI 响应缓存使用的共享内存区, 默认 off, zone 名需与 fastcgi_cache_path 的 keys_zone 保持一致
    fastcgi_cache_background_update on; # 启用过期 FastCGI 缓存后台更新, 默认 off, 先向客户端返回旧缓存再后台刷新, 需配合 fastcgi_cache 和 fastcgi_cache_use_stale updating 使用
    fastcgi_cache_bypass "$fastcgi_skip_cache"; # 用于定义 FastCGI 缓存读取绕过条件, 默认无
    fastcgi_no_cache "$fastcgi_skip_cache"; # 用于定义 FastCGI 响应不写入缓存的条件, 默认无
    fastcgi_cache_key "$scheme$request_method$host$request_uri"; # 定义 FastCGI 缓存对象的唯一键, 默认无, 按协议, 请求方法, 主机名和完整原始 URI 隔离缓存
    fastcgi_cache_lock on; # 启用 FastCGI 缓存填充锁, 默认 off, 同一缓存键仅允许一个请求回源填充以降低缓存击穿
    fastcgi_cache_lock_age 5s; # 设置 FastCGI 缓存填充请求未完成时允许额外请求回源的等待时间, 默认 5s
    fastcgi_cache_lock_timeout 5s; # 设置等待 FastCGI 缓存填充锁的超时时间, 默认 5s, 超时后请求直接回源且响应不写入缓存
    # fastcgi_cache_max_range_offset 10m; # 设置允许参与 FastCGI 缓存的字节范围请求最大起始偏移量, 默认无, 超过该偏移量的 Range 请求直接回源且响应不缓存
    fastcgi_cache_methods GET HEAD; # 设置允许写入 FastCGI 缓存的请求方法, 默认 GET HEAD
    fastcgi_cache_min_uses 2; # 设置响应写入 FastCGI 缓存前同一缓存键所需的最少请求次数, 默认 1, 可减少低频请求造成的缓存污染

    # 定义 FastCGI 缓存路径、目录层级、共享内存索引和磁盘容量, 默认未配置, inactive 默认 10m
    fastcgi_cache_path /var/cache/openresty/fastcgi_cache levels=1:2 keys_zone=fastcgi:32m max_size=1g inactive=60m use_temp_path=off;
    fastcgi_cache_revalidate on; # 启用过期 FastCGI 缓存的条件重新验证, 默认 off, 使用 If-Modified-Since 和 If-None-Match 向上游验证缓存是否仍有效
    fastcgi_cache_use_stale error timeout invalid_header updating http_500 http_503; # 上游异常或缓存更新时允许返回过期 FastCGI 缓存, 默认 off

    # 设置成功响应和重定向响应的 FastCGI 缓存有效期, 默认未配置, 上游缓存响应头优先级更高
    fastcgi_cache_valid 200 301 60m;
    fastcgi_cache_valid 302 10m;
    fastcgi_cache_valid 404 1m;

    fastcgi_connect_timeout 30s; # 设置与 FastCGI 上游建立连接的超时时间, 默认 60s, 通常无法超过 75s
    fastcgi_hide_header X-Powered-By; # 隐藏 FastCGI 上游返回的 X-Powered-By 响应头, 默认未额外隐藏该字段
    fastcgi_intercept_errors on; # 拦截 FastCGI 上游错误响应并交由 error_page 处理, 默认 off
    fastcgi_keep_conn on; # 保持与 FastCGI 上游的持久连接以便复用, 默认 off, 使用 upstream keepalive 时必须启用
    fastcgi_read_timeout 60s; # 设置从 FastCGI 上游连续两次读取之间的超时时间, 默认 60s, 超时期间上游未发送任何数据则关闭连接
    fastcgi_send_timeout 60s; # 设置向 FastCGI 上游连续两次写操作之间的超时时间, 默认 60s, 并非整个请求发送过程的总超时

##############################
    ## https://nginx.org/en/docs/http/ngx_http_proxy_module.html
    proxy_buffer_size 16k; # 设置读取上游响应首部的缓冲区大小, 默认一个内存页, 通常为 4k 或 8k, 过小可能导致较大响应头被判定为无效
    proxy_buffering on; # 启用上游响应缓冲, 默认 on, 响应优先读入内存缓冲区, 超出时可写入临时文件
    proxy_buffers 8 16k; # 设置每个代理连接读取上游响应的缓冲区数量和大小, 默认 8 个内存页, 通常为 8 4k 或 8 8k
    proxy_busy_buffers_size 32k; # 设置响应尚未完全读取时可用于向客户端发送数据的 busy buffer 总大小, 默认等于两个缓冲区大小, 仅在 proxy_buffering on 时生效
    # proxy_cache proxy;
    proxy_cache_background_update on; # 启用过期缓存后台更新, 默认 off, 需配合 proxy_cache_use_stale updating 使用 stale 缓存
    proxy_cache_bypass "$proxy_skip_cache";
    proxy_no_cache "$proxy_skip_cache";

    # https://github.com/hestiacp/hestiacp/blob/main/install/deb/nginx/nginx.conf
    proxy_cache_key "$scheme$host$proxy_host$request_uri"; # 定义代理缓存对象的唯一键, 默认 $scheme$proxy_host$request_uri, 增加 $host 隔离不同虚拟主机
    proxy_cache_lock on; # 启用代理缓存填充锁, 默认 off, 同一缓存键发生 MISS 时仅允许一个请求回源填充缓存

    # https://cdn.studio.f5.com/files/k6fem79d/production/35ce3e42d2eb2930619f715b6586ac9a18d5a1e5.pdf
    proxy_cache_lock_age 10s; # 设置缓存填充请求独占缓存锁的最长时间, 默认 5s, 超时后允许另一个请求回源尝试填充缓存
    proxy_cache_lock_timeout 5s; # 设置等待代理缓存填充锁的超时时间, 默认 5s, 超时后请求直接回源且响应不写入缓存
    # proxy_cache_max_range_offset 10m; # 设置可参与缓存的字节范围请求最大起始偏移量, 默认未配置, 超过该偏移量的 Range 请求直接回源且响应不缓存
    proxy_cache_methods GET HEAD; # 设置允许缓存的请求方法, 默认 GET HEAD, GET 和 HEAD 始终自动加入缓存方法列表

    # https://www.f5.com/company/blog/nginx/nginx-caching-guide
    proxy_cache_min_uses 3; # 设置同一缓存键达到指定请求次数后才缓存响应, 默认 1, 可减少低频请求造成的缓存污染

    # 用于定义代理缓存路径和共享内存区, 默认无配置, 只能写在 http 块
    # keys_zone 保存缓存键和元数据, 1m 约存 8000 个 key, inactive 表示多久未访问后清理, 不是缓存有效期
    proxy_cache_path  /var/cache/openresty/proxy_cache levels=1:2 keys_zone=proxy:20m max_size=1g inactive=1h use_temp_path=off;

    # 用于启用过期缓存的条件 revalidate, 默认 off, 1.5.7+ 支持
    # 上游响应带 Last-Modified 或 ETag 时可用 If-Modified-Since/If-None-Match 验证, 适合静态资源和可缓存内容
    proxy_cache_revalidate  on;

    # 用于允许在上游异常或缓存更新时返回过期代理缓存, 默认 off
    # updating 可配合 proxy_cache_background_update 使用, error/timeout/5xx 可提升上游故障时的可用性, 通用缓存模板不建议包含 403/404/429
    # proxy_cache_use_stale  error timeout updating http_500 http_502 http_503 http_504;

    # 用于按响应状态码定义代理缓存有效期, 官方无默认值, 未显式指定状态码时仅适用于 200/301/302
    # 上游 X-Accel-Expires Expires Cache-Control 的缓存策略优先级高于本指令, Set-Cookie 与 Vary:* 响应默认不缓存
    # 通用反代缓存场景仅缓存成功/重定向响应, 404 短缓存用于降低无效请求回源, 不建议使用 any 或缓存 5xx
    proxy_cache_valid  200 302  120m;
    proxy_cache_valid  301      1d;
    proxy_cache_valid  404      10m;
    proxy_cache_valid  500 502 503 504 0s;
    # proxy_cache_valid  any      1m;

    # 用于设置与代理上游建立 TCP 连接的超时时间, 默认 60s, 通常不应超过 75s
    # 只限制连接建立阶段, 不包含发送请求和读取响应, 通用反代模板建议保持默认或按内网/公网链路适当缩短
    proxy_connect_timeout  30s;

    # 用于设置 proxy_hide_header 和 proxy_set_header 使用的哈希表 bucket 大小, 默认 64
    # 通用反代模板建议保持默认, 只有自定义代理请求头较多或启动提示 hash bucket 空间不足时再调大
    proxy_headers_hash_bucket_size  64;

    # 用于设置 proxy_hide_header 和 proxy_set_header 使用的哈希表最大大小, 默认 512
    # 通用反代模板建议保持默认, 只有代理请求头配置很多或启动提示 hash max size 不足时再调大
    proxy_headers_hash_max_size  512;

    # 用于隐藏代理上游暴露的后端技术栈响应头, 默认无额外隐藏字段
    # 仅影响返回给客户端的响应头, 不等于关闭 nginx 自身 Server 头, 通用反代模板可按需启用
    proxy_hide_header  X-Powered-By;

    # 用于拦截代理上游返回的 300 及以上响应并交由 error_page 处理, 默认 off
    # 适合统一 404/50x 错误页或隐藏上游错误内容, 开启后需确认不会影响正常 301/302 跳转
    proxy_intercept_errors  on;

    # 用于限制从代理上游读取响应的速度, 默认 0, 表示不限速, 1.7.7+ 支持
    # 限制按单个请求计算且仅在 proxy_buffering on 时生效, 通用反代模板建议保持默认, 避免无意拖慢回源读取
    proxy_limit_rate  0;

    # 用于设置读取代理上游响应的相邻读操作超时时间, 默认 60s, 仅限制两次 read 之间的空闲时间
    # 不限制完整响应传输耗时, 通用反代模板建议保持默认, 长耗时接口或流式响应可在单独 location 放宽
    proxy_read_timeout  30s;

    # 用于设置向代理上游发送请求的相邻写操作超时时间, 默认 60s, 仅限制两次 write 之间的空闲时间
    # 不限制完整请求传输耗时, 通用反代模板建议保持默认, 大请求体上传或弱上游接收慢时可单独放宽
    proxy_send_timeout  30s;

    # 用于为代理上游连接启用 TCP SO_KEEPALIVE, 默认 off, 1.15.6+ 支持
    # 适合长连接或跨 NAT/防火墙链路, 但探测周期仍取决于系统 tcp_keepalive_* 参数, 普通短连接反代不必开启
    proxy_socket_keepalive  on;

    include /etc/nginx/conf.d/*.conf;
}

include /etc/nginx/conf.d/*.main;
