<!doctype html>
<html lang="en" style="height: 100%; font-family: &quot;Microsoft YaHei&quot;, Arial, sans-serif">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Server Error</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="https://fastly.jsdelivr.net/gh/jdecked/twemoji@54df6a1340154c4f5bad09c85de8b720c5373c03/assets/svg/26d4.svg"
    />
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        background-color: #fff;
        color: #333;
        padding: 20px;
      }

      .content {
        max-width: 600px;
        width: 100%;
      }

      h2 {
        font-size: 6vw;
        margin: 10px 0;
        font-weight: normal;
      }

      p {
        font-size: 4vw;
        color: #666;
        margin: 8px 0;
      }

      @media (min-width: 600px) {
        h2 {
          font-size: 32px;
        }

        p {
          font-size: 16px;
        }
      }

      @media (prefers-color-scheme: dark) {
        body {
          background-color: #000;
          color: #ccc;
        }

        p {
          color: #aaa;
        }
      }
    </style>
  </head>

  <body>
    <div class="content">
      <h2>Server Error</h2>
      <p>That's an error.</p>
      <p>
        The server encountered an internal error and was unable to complete your request. Either the server is
        overloaded or there is an error in the application.
      </p>
    </div>
  </body>
</html>
