# /etc/nginx/nginx.conf

load_module modules/ngx_http_acme_module.so;

##############################
# https://nginx.org/en/docs/ngx_core_module.html
user nginx nginx;
worker_processes auto;

pcre_jit on;
thread_pool default threads=32 max_queue=65536;
# quic_bpf on;

error_log /var/log/nginx/error.log error;
pid       /run/nginx.pid;

events {
    use epoll;
    # multi_accept on;
    worker_connections 4096;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    charset       utf-8;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log main buffer=32k flush=10s;
##############################
    ## https://nginx.org/en/docs/http/ngx_http_core_module.html
    auth_delay 0s;
    chunked_transfer_encoding on;
    client_body_buffer_size 128k;
    client_body_timeout 60s;
    client_header_buffer_size 1k;
    client_header_timeout 30s;
    client_max_body_size 2m;
    etag on;
    keepalive_min_timeout 5s;
    keepalive_requests 1000;
    keepalive_time 1h;
    keepalive_timeout 65s;
    large_client_header_buffers 4 8k;
    limit_rate 0;
    limit_rate_after 0;
    max_headers 1000;
    msie_padding off;
    open_file_cache max=2000 inactive=30s;
    open_file_cache_errors on;
    open_file_cache_min_uses 2;
    open_file_cache_valid 60s;
    output_buffers 2 32k;
    reset_timedout_connection on;
    resolver 8.8.8.8 1.1.1.1 valid=30s ipv6=off;
    resolver_timeout 5s;
    send_timeout 60s;
    sendfile on;
    sendfile_max_chunk 2m;
    server_names_hash_max_size 1024;
    server_tokens off;
    # subrequest_output_buffer_size 8k;
    tcp_nodelay on;
    tcp_nopush on;
    types_hash_bucket_size 64;
    types_hash_max_size 1024;
    underscores_in_headers off;
    variables_hash_bucket_size 64;
    variables_hash_max_size 2048;

##############################
    ## https://nginx-extras.getpagespeed.com/zh/modules/zstd
    # zstd on;
    # zstd_comp_level 3;
    # zstd_min_length 1k;
    # # zstd_buffers 32 4k;
    # zstd_static on;
    # zstd_types
    #     text/plain text/css text/javascript text/xml text/wgsl
    #     application/javascript application/json application/ld+json
    #     application/manifest+json application/xml
    #     application/rss+xml application/atom+xml
    #     application/vnd.api+json application/xhtml+xml application/wasm
    #     image/svg+xml;

##############################
    ## https://github.com/google/ngx_brotli
    # brotli_static on;
    # brotli on;
    # brotli_comp_level 6;
    # brotli_window 512k;
    # brotli_min_length 1k;
    # brotli_types
    #     text/plain text/css text/javascript text/xml text/wgsl
    #     application/javascript application/json application/ld+json
    #     application/manifest+json application/xml
    #     application/rss+xml application/atom+xml
    #     application/vnd.api+json application/xhtml+xml application/wasm
    #     image/svg+xml;

##############################
    ## https://nginx.org/en/docs/http/ngx_http_gzip_module.html
    gzip on;
    gzip_static on;
    # gzip_buffers 32 4k;
    gzip_comp_level 4;
    gzip_http_version 1.1;
    gzip_min_length 1k;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types
        text/plain text/css text/javascript text/xml text/wgsl
        application/javascript application/json application/ld+json
        application/manifest+json application/xml
        application/rss+xml application/atom+xml
        application/vnd.api+json application/xhtml+xml application/wasm
        image/svg+xml;
    gzip_vary on;

##############################
    ## https://nginx.org/en/docs/http/ngx_http_v3_module.html
    http3 on;
    http3_max_concurrent_streams 256;
    http3_stream_buffer_size 128k;
    quic_active_connection_id_limit 4;
    quic_gso on;
    quic_retry on;

##############################
    ## https://nginx.org/en/docs/http/ngx_http_v2_module.html
    http2 on;
    http2_body_preread_size 64k;
    http2_chunk_size 16k;
    http2_max_concurrent_streams 256;
    http2_recv_buffer_size 256k;

##############################
    ## https://nginx.org/en/docs/http/ngx_http_acme_module.html
    # acme_issuer letsencrypt {
    #     uri https://acme-v02.api.letsencrypt.org/directory;
    #     challenge http-01;
    #     # contact admin@example.com;
    #     ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    #     ssl_verify on;
    #     state_path /etc/nginx/certs/acme_letsencrypt;
    #     accept_terms_of_service;
    # }
    # acme_shared_zone zone=ngx_acme_shared:1m;

##############################
    ## https://nginx.org/en/docs/http/ngx_http_ssl_module.html
    ssl_buffer_size 8k;
    ssl_certificate_cache max=2000 inactive=20s valid=1m;
    ssl_certificate_compression on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_ecdh_curve auto;
    ssl_prefer_server_ciphers off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;
    ssl_session_timeout 1d;
    ssl_stapling off;
    # ssl_stapling_verify off;
    # ssl_verify_client off;

##############################
    ## https://nginx.org/en/docs/http/ngx_http_headers_module.html
    # add_header Content-Security-Policy "default-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'self'; form-action 'self'" always;
    # add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # add_header X-Content-Type-Options "nosniff" always;
    # add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # add_header X-Frame-Options "SAMEORIGIN" always;
    add_header_inherit merge;

    ## https://github.com/openresty/headers-more-nginx-module
    more_clear_headers 'Server' 'X-Powered-By' 'X-AspNet-Version' 'X-AspNetMvc-Version' 'X-Generator';
    # more_set_headers 'Server: Apache';
    more_set_headers "Strict-Transport-Security: max-age=31536000; includeSubDomains";
    more_set_headers "X-Content-Type-Options: nosniff";
    more_set_headers "Referrer-Policy: strict-origin-when-cross-origin";
    more_set_headers "X-Frame-Options: SAMEORIGIN";

##############################
    ## https://nginx.org/en/docs/http/ngx_http_limit_conn_module.html
    limit_conn_zone $binary_remote_addr zone=addr:20m;
    # limit_conn addr 200;
    limit_conn_log_level error;
    limit_conn_status 503;

##############################
    ## https://nginx.org/en/docs/http/ngx_http_limit_req_module.html
    limit_req_zone $binary_remote_addr zone=one:20m rate=50r/s;
    # limit_req zone=one burst=200 nodelay;
    limit_req_log_level error;
    limit_req_status 429;

##############################
    ## https://nginx.org/en/docs/http/ngx_http_fastcgi_module.html
    fastcgi_buffer_size 16k;
    fastcgi_buffering on;
    fastcgi_buffers 8 16k;
    fastcgi_busy_buffers_size 32k;
    # fastcgi_cache fastcgi;
    fastcgi_cache_background_update on;
    fastcgi_cache_key "$scheme$request_method$host$request_uri";
    fastcgi_cache_lock on;
    fastcgi_cache_lock_age 5s;
    fastcgi_cache_lock_timeout 5s;
    # fastcgi_cache_max_range_offset 10m;
    fastcgi_cache_methods GET HEAD;
    fastcgi_cache_min_uses 2;
    fastcgi_cache_path /var/cache/nginx/fastcgi_cache levels=1:2 keys_zone=fastcgi:32m max_size=1g inactive=60m use_temp_path=off;
    fastcgi_cache_revalidate on;
    fastcgi_cache_use_stale error timeout invalid_header updating http_500 http_503;
    fastcgi_cache_valid 200 301 60m;
    fastcgi_cache_valid 302 10m;
    fastcgi_cache_valid 404 1m;
    fastcgi_connect_timeout 10s;
    fastcgi_hide_header X-Powered-By;
    fastcgi_intercept_errors on;
    fastcgi_keep_conn on;
    fastcgi_read_timeout 60s;
    fastcgi_send_timeout 60s;

##############################
    ## https://nginx.org/en/docs/http/ngx_http_proxy_module.html
    proxy_buffer_size 16k;
    proxy_buffering on;
    proxy_buffers 8 16k;
    proxy_busy_buffers_size 32k;
    # proxy_cache proxy;
    proxy_cache_background_update on;
    proxy_cache_key "$scheme$host$proxy_host$request_uri";
    proxy_cache_lock on;
    proxy_cache_lock_age 10s;
    proxy_cache_lock_timeout 5s;
    # proxy_cache_max_range_offset 10m;
    proxy_cache_methods GET HEAD;
    proxy_cache_min_uses 3;
    proxy_cache_path /var/cache/nginx/proxy_cache levels=1:2 keys_zone=proxy:32m max_size=1g inactive=60m use_temp_path=off;
    proxy_cache_revalidate on;
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    proxy_cache_valid 200 301 60m;
    proxy_cache_valid 302 10m;
    proxy_cache_valid 404 1m;
    proxy_connect_timeout 10s;
    proxy_headers_hash_bucket_size 64;
    proxy_headers_hash_max_size 512;
    proxy_hide_header X-Powered-By;
    proxy_intercept_errors on;
    proxy_limit_rate 0;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;

    include /etc/nginx/conf.d/*.conf;
}
