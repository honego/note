server {
    listen       80 reuseport default_server;
    listen       [::]:80 reuseport default_server;
    server_name  _;

    return       444;

    # https://mailman.nginx.org/pipermail/nginx-devel/2018-September/011458.html
    # https://trac.nginx.org/nginx/ticket/1756
    error_page 400 405 414 494 501 505 = /__close_conn;
    location = /__close_conn {
        internal;
        return   444;
    }
}

server {
    listen       443 ssl reuseport default_server;
    listen       [::]:443 ssl reuseport default_server;
    listen       443 quic reuseport default_server;
    listen       [::]:443 quic reuseport default_server;
    server_name  _;

    ssl_reject_handshake on;
    ssl_certificate      /etc/nginx/certs/default_server.crt;
    ssl_certificate_key  /etc/nginx/certs/default_server.key;
    ssl_stapling         off;
    ssl_stapling_verify  off;

    return       444;

    # 400: 异常或无法解析的 HTTP 请求
    # 405: 不支持的 HTTP 方法
    # 414: 请求行或 URI 过长
    # 421: HTTP/2 请求被发送到错误的虚拟主机
    # 494: 请求头/Cookie 超过缓冲区
    # 497: HTTPS 端口收到明文 HTTP
    # 501: 请求方法无法实现或无法识别
    # 505: HTTP 版本不支持
    error_page 400 405 414 421 494 497 501 505 = /__close_conn;
    location = /__close_conn {
        internal;
        return   444;
    }
}

# https://www.rfc-editor.org/info/rfc1918
