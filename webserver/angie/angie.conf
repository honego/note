# /etc/angie/angie.conf

##############################
# https://cn.angie.software/angie/docs/configuration/modules/core
user angie angie; # 设置 worker 进程运行的用户和组, NGINX 源码默认 nobody nobody, 实际默认值可由构建参数覆盖
worker_processes auto; # 设置工作进程数量, 通常为CPU核心数

pcre_jit on; # 启用 PCRE/PCRE2 正则表达式 JIT 编译, 默认 off, 需要底层 PCRE/PCRE2 支持 JIT
thread_pool default threads=32 max_queue=65536; # 定义默认线程池, 默认 32 个线程和最多 65536 个排队任务
# quic_bpf on; # 控制是否使用 eBPF 路由 QUIC 数据包以支持连接迁移, 默认 off, 仅 Linux 5.7+ 支持

error_log /var/log/angie/error.log error;
pid       /run/angie.pid;

events {
    use epoll; # 使用 epoll 事件模型, Linux 下通常会自动选择最高效的事件处理方法
    # multi_accept on; # 控制 worker 收到连接事件后是否一次接受所有待处理连接, 默认 off

    # https://docs.nginx.com/nginx-gateway-fabric/how-to/scaling
    worker_connections 4096; # 设置单个 worker 可同时打开的最大连接数, 默认 512, 包含客户端和 upstream 等所有连接
}

http {
    include       /etc/angie/mime.types;
    default_type  application/octet-stream;
    charset       utf-8;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                     '$status $body_bytes_sent "$http_referer" '
                     '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/angie/access.log main buffer=32k flush=10s; # 记录 HTTP 访问日志并缓冲写入, 默认 access.log combined 且不启用缓冲, 最多延迟 10s 写出
##############################

    include /etc/angie/conf.d/*.conf;
}
