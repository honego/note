# Reference:
# https://developer.wordpress.org/advanced-administration/server/web-server/nginx

# 定义 PHP-FPM FastCGI 上游, 使用 Unix Socket 可减少 TCP 栈开销, 容器或跨主机部署时可改为 php:9000
# keepalive 需配合 `fastcgi_keep_conn on;` 才能复用连接, 该值表示每个 Nginx worker 保留的空闲上游连接数
# 空闲连接上限约为 `worker_processes × keepalive`, 如: 2 核 2G 且 `worker_processes auto` 时约为 2 × 16 = 32 条
upstream php {
    # server php:9000;
    server unix:/run/php/php-fpm.sock;
    keepalive 16; # 空闲连接池大小
}

server {
    listen       80;
    listen       [::]:80;
    server_name  blog.honeok.com;
    return 301   https://$host$request_uri;
}

server {
    listen       443 ssl;
    listen       [::]:443 ssl;
    listen       443 quic;
    listen       [::]:443 quic;
    server_name  blog.honeok.com;

    ssl_certificate      /etc/nginx/certs/honeok.com_fullchain.pem;
    ssl_certificate_key  /etc/nginx/certs/honeok.com_key.pem;

    resolver 1.1.1.1 8.8.8.8 valid=30s ipv6=off;
    resolver_timeout 5s;

    client_max_body_size 15m;
    add_header_inherit merge; # 合并继承上级配置中的 add_header, 仅对 add_header 指令生效, 该指令出现在版本 1.29.3 中
    more_set_headers 'Alt-Svc: h3=":443"; ma=86400,h3-29=":443"; ma=86400';

    # Umami
    sub_filter_once on;
    sub_filter '</head>' '<script defer src="https://u.honeok.com/script.js" data-website-id="b630bd25-ae61-4321-97bb-017bbbf1eb35"></script></head>';

    # 访问控制
    access_by_lua_file /etc/nginx/lua/access/entry.lua;

##############################
# PHP cache judge.
    set $no_cache 0;

    # POST 请求不缓存
    if ($request_method = POST) {
        set $no_cache 1;
    }

    # 带查询参数的请求不缓存
    if ($query_string != "") {
        set $no_cache 1;
    }

    # WordPress 后台 REST API 登录 Feed Sitemap 等不缓存
    if ($request_uri ~* "(/wp-admin/|/wp-json/|/xmlrpc.php|/wp-(app|cron|login|register|mail).php|wp-.*.php|/feed/|index.php|wp-comments-popup.php|wp-links-opml.php|wp-locations.php|sitemap(_index)?.xml|[a-z0-9_-]+-sitemap([0-9]+)?.xml)") {
        set $no_cache 1;
    }

    # WordPress 登录用户、密码保护、评论用户不缓存
    if ($http_cookie ~* "comment_author|wordpress_[a-f0-9]+|wp-postpass|wordpress_no_cache|wordpress_logged_in") {
        set $no_cache 1;
    }

##############################
# WordPress主站点路径及路由
    location / {
        root /usr/local/openresty/nginx/html/wordpress;
        index index.php;
        try_files $uri $uri/ /index.php?$args;
    }

##############################
# Global restrictions file.
    location = /favicon.ico {
        root /usr/local/openresty/nginx/html/wordpress;
        log_not_found off;
        access_log off;
    }

    location = /robots.txt {
        root /usr/local/openresty/nginx/html/wordpress;
        allow all;
        log_not_found off;
        access_log off;
    }

    # 拒绝所有访问隐藏文件 (例如: .htaccess .htpasswd .DS_Store) 的尝试
    location ~ /\. {
        # deny all;
        access_by_lua_block {
            return ngx.exit(444)
        }
    }

    # 禁止访问上传目录中所有扩展名为 .php 的文件
    location ~* /(?:uploads|files)/.*\.php$ {
        # deny all;
        access_by_lua_block {
            return ngx.exit(444)
        }
    }

##############################
    location ~ \.php$ {
        root /var/www/html/wordpress;
        index index.php;

        # try_files $uri =404;
        include fastcgi_params;
        fastcgi_index index.php;
        fastcgi_pass php;
        fastcgi_keep_conn on;
        fastcgi_intercept_errors on;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;

        fastcgi_cache fastcgi;
        fastcgi_cache_methods GET HEAD;
        fastcgi_cache_bypass $no_cache $http_authorization;
        fastcgi_no_cache $no_cache $http_authorization;
        fastcgi_cache_valid 200 1h;

        fastcgi_cache_lock on;
        fastcgi_cache_background_update on;
        fastcgi_cache_revalidate on;
        fastcgi_cache_use_stale error timeout invalid_header updating http_500; # `updating` 用于配合 fastcgi_cache_background_update
    }

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|bmp|swf|eot|svg|ttf|woff|woff2|webp)$ {
        root /usr/local/openresty/nginx/html/wordpress;
        aio threads;
        # expires max; # 315360000 秒 = 3650 天 ≈ 10 年
        access_log off;
        log_not_found off;
        try_files $uri =404;
        more_set_headers 'Cache-Control: public, max-age=2592000';
    }

##############################
# internal html.
    error_page 403 /403.html;
    location = /403.html {
        root /usr/local/openresty/nginx/html;
        internal;
    }

    error_page 404 /404.html;
    location = /404.html {
        root /usr/local/openresty/nginx/html;
        internal;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/local/openresty/nginx/html;
        internal;
    }
}
