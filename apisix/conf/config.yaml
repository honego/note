# https://github.com/apache/apisix/blob/3.18.0/conf/config.yaml.example
# https://github.com/apache/apisix/blob/3.18.0/apisix/cli/config.lua

---
apisix:
  node_listen: 9080 # APISIX HTTP 请求监听端口
  enable_admin: true # Admin API
  enable_dev_mode: false # 开发模式, 启用后将 Nginx worker_processes 设置为 1
  enable_reuseport: true # 启用 SO_REUSEPORT, 允许多个 Nginx worker 复用监听端口
  show_upstream_status_in_response_header: false # 控制是否在响应头中返回上游状态码, false 时仅上游返回 5xx 才返回 X-APISIX-Upstream-Status

  enable_ipv6: true
  enable_http2: true

  # proxy_protocol:
  #   listen_http_port: 9181 # 接收携带 PROXY Protocol 的 HTTP 请求监听端口
  #   listen_https_port: 9182 # 接收携带 PROXY Protocol 的 HTTPS 请求监听端口
  #   enable_tcp_pp: true # 是否在所有 TCP stream 监听端口接收 PROXY Protocol
  #   enable_tcp_pp_to_upstream: true # 是否向所有 TCP stream 上游发送 PROXY Protocol

  enable_control: true
  control:
    ip: "0.0.0.0"
    port: 9092

# deployment:
#   role: traditional
#   role_traditional:
#     config_provider: etcd
#   etcd:
#     host:
#       - http://127.0.0.1:2379
#
# To configure via environment variables, you can use `${{VAR}}` syntax. For instance:
#
# deployment:
#   role: traditional
#   role_traditional:
#     config_provider: etcd
#   etcd:
#     host:
#       - http://${{ETCD_HOST}}:2379
#
# And then run `export ETCD_HOST=$your_host` before `make init`.
#
# If the configured environment variable can't be found, an error will be thrown.
#
# Also, If you want to use default value when the environment variable not set,
# Use `${{VAR:=default_value}}` instead. For instance:
#
# deployment:
#   role: traditional
#   role_traditional:
#     config_provider: etcd
#   etcd:
#     host:
#       - http://${{ETCD_HOST:=localhost}}:2379
#
# This will find environment variable `ETCD_HOST` first, and if it's not exist it will use `localhost` as default value.

deployment:
  role: traditional
  role_traditional:
    config_provider: etcd
  admin:
    admin_key:
      - name: admin
        key: "" # using fixed API token has security risk, please update it when you deploy to production environment. If passed empty then will be autogenerated by APISIX and will be written back here. Recommended is to use external mechanism to generate and store the token.
        role: admin
