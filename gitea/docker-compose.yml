# https://docs.gitea.com/zh-cn/1.24/installation/install-with-docker-rootless
---
services:
  gitea:
    image: gitea/gitea:1.27.2-rootless
    container_name: gitea
    restart: unless-stopped
    ports:
      - 3000:3000
      - 2222:2222
    volumes:
      - /usr/share/zoneinfo/Asia/Shanghai:/etc/localtime:ro
      - $PWD/data:/var/lib/gitea
      - $PWD/config:/etc/gitea
    depends_on:
      - db

  db:
    image: postgres:14
    container_name: gitea-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=gitea
      - POSTGRES_PASSWORD=gitea
      - POSTGRES_DB=gitea
    volumes:
      - $PWD/postgres:/var/lib/postgresql/data
